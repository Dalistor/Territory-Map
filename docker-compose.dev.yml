name: territory-map-dev

# Development stack: only the database. The API runs on the host with
#   cd server && uv run uvicorn app.main:app --reload

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: territory_map_db_dev
    environment:
      POSTGRES_USER: territory
      POSTGRES_PASSWORD: territory
      # The application databases are created by the init script below.
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgis_dev_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U territory -d territory_map"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgis_dev_data:
