# Alembic configuration for the Territory Map server.
#
# Run from the `server/` directory:
#   uv run alembic upgrade head
#   uv run alembic revision --autogenerate -m "add something"
#
# The database URL is NOT set here: env.py reads it from app.core.config.Settings
# (i.e. from DATABASE_URL in the environment / .env), so there is a single source
# of truth and no credential ever lands in a versioned file.

[alembic]
script_location = %(here)s/migrations

# Date-prefixed file names keep the versions directory readable in chronological
# order, since the revision hash alone says nothing about when it was written.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Alembic is always invoked from `server/`, so `.` makes the `app` package importable.
prepend_sys_path = .

path_separator = os


[post_write_hooks]


# Logging configuration, consumed by env.py.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
