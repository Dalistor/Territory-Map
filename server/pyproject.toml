[project]
name = "territory-map-server"
version = "0.1.0"
description = "Territory Map API - territory and block management for congregations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2",
    "psycopg[binary]>=3.2",
    "geoalchemy2>=0.15",
    "alembic>=1.13",
    "pydantic>=2",
    "pydantic-settings>=2.3",
    "passlib[bcrypt]>=1.7.4",
    # passlib 1.7.4 reads bcrypt.__about__, removed in bcrypt 5.x
    "bcrypt>=4.0,<5",
    "python-jose[cryptography]>=3.3",
    # cryptography 49+ ships macOS wheels for arm64 only; capping keeps
    # x86_64 macOS dev machines from having to build it via Rust/OpenSSL.
    "cryptography>=44,<49",
    "shapely>=2",
    "slowapi>=0.1.9",
    "apscheduler>=3.10",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.6",
]

# The app is run from the source tree (uvicorn app.main:app), never installed as
# a distribution, so uv does not need a build backend for it.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
