# The bundle identity macOS/Windows show the admin: without these two the
# scaffold defaults would install the app as literally "admin", under
# `com.electron.app`. `productName` also decides the `userData` folder the
# packaged app keeps its encrypted credentials in (`main/credentials-store.ts`),
# so changing it later would orphan a real installation's saved login.
appId: com.dalistor.territory-map-admin
productName: Territory Map Admin
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
# The runtime config (`API_BASE_URL`, `APP_KEY`) travels next to the app, not
# inside the asar: `main/index.ts` reads `Contents/Resources/.env` when
# packaged, so an installed copy can be pointed at another server by editing a
# text file instead of rebuilding. Packaging fails loudly if `admin/.env` is
# missing — better than shipping an app that dies on first launch, which is
# exactly what happened before this entry existed.
extraResources:
  - from: .env
    to: .env
  - from: resources/S-13_T_template.docx
    to: resources/S-13_T_template.docx
win:
  executableName: admin
  target:
    - nsis
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target:
    - dmg
    - zip
  entitlementsInherit: build/entitlements.mac.plist
  # The scaffold's camera/microphone/Documents/Downloads usage strings were
  # dropped: this app asks for none of them, and a privacy prompt reason for a
  # permission that is never requested is a claim the app cannot honour.
  category: public.app-category.productivity
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - tar.gz
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
