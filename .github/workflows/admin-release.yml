name: admin-release

# Builds the desktop admin and attaches the binaries to a GitHub Release.
#
# Only on a tag: the binaries are a release artifact, not something to produce
# on every push. Flutter does not cross-compile, so each target builds on its
# own runner.
#
# macOS is deliberately absent. There is no Mac in this setup able to build it
# (the dev machine has the Command Line Tools, not the full Xcode), and the
# admin runs on Windows in practice. Adding it later is one matrix entry plus a
# `macos-latest` runner.
#
# Nothing here is signed. Windows SmartScreen and Gatekeeper will warn on first
# launch; that is expected and is documented for the admin rather than worked
# around, since signing needs a paid certificate.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: admin-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            runs-on: windows-latest
            artifact: build/windows/x64/runner/Release
          - target: linux
            runs-on: ubuntu-latest
            artifact: build/linux/x64/release/bundle

    runs-on: ${{ matrix.runs-on }}

    defaults:
      run:
        working-directory: admin

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Linux build dependencies
        if: matrix.target == 'linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # A green build only proves it compiles; nobody clicks a binary in CI.
      # The widget tests are what says it behaves.
      - name: Test
        run: flutter test

      - name: Build
        run: flutter build ${{ matrix.target }} --release

      - uses: actions/upload-artifact@v4
        with:
          name: territory-map-admin-${{ matrix.target }}
          path: admin/${{ matrix.artifact }}
          if-no-files-found: error
