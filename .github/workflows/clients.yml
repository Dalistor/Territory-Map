name: clients

# The Dart side of the monorepo. `core` runs on every change to the shared
# package, because both clients depend on it and a break there breaks both.
# The admin binaries are built only on a tag: they are a release artifact, not
# something to produce on every push.

on:
  push:
    paths:
      - "packages/core/**"
      - "admin/**"
      - ".github/workflows/clients.yml"
    tags:
      - "v*"
  pull_request:
    paths:
      - "packages/core/**"
      - "admin/**"
      - ".github/workflows/clients.yml"
  workflow_dispatch:

concurrency:
  group: clients-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  core:
    name: Shared package
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/core

    steps:
      - uses: actions/checkout@v4

      # Dart alone, not Flutter: the package deliberately does not depend on
      # flutter, and using the bare SDK here is what keeps that honest -- an
      # accidental flutter import would fail this job instead of going unnoticed
      # until the first pure-Dart consumer.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: dart test

      - name: Coverage on geo/
        # CLAUDE.md sets 100% on geo/: it is the single source of the coordinate
        # conversion and the polygon pre-validation, and a gap there is a bug
        # that reaches both clients.
        run: |
          dart pub global activate coverage
          dart test --coverage=.coverage
          dart pub global run coverage:format_coverage \
            --lcov --in=.coverage --out=.coverage/lcov.info \
            --report-on=lib --check-ignore
          awk -F: '
            /^SF:/ { file = $2 }
            /^LF:/ { found = $2 }
            /^LH:/ {
              hit = $2
              if (file ~ /lib\/geo\//) {
                printf "%s: %d/%d\n", file, hit, found
                if (hit != found) failed = 1
              }
            }
            END { exit failed }
          ' .coverage/lcov.info

  admin:
    name: Build admin (${{ matrix.target }})
    # Only on a tag. Flutter does not cross-compile, so each target needs its
    # own runner. macOS is deliberately absent: there is no Mac in this setup to
    # sign or verify the result on, and the admin runs on Windows in practice.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: core

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            runs-on: windows-latest
            artifact: build/windows/x64/runner/Release
          - target: linux
            runs-on: ubuntu-latest
            artifact: build/linux/x64/release/bundle

    runs-on: ${{ matrix.runs-on }}

    defaults:
      run:
        working-directory: admin

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Linux build dependencies
        if: matrix.target == 'linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build
        run: flutter build ${{ matrix.target }} --release

      - uses: actions/upload-artifact@v4
        with:
          name: territory-map-admin-${{ matrix.target }}
          path: admin/${{ matrix.artifact }}
          if-no-files-found: error
