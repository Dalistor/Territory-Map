name: server

# Lint + tests on every push and pull request that touches the server, and, on
# `main` only, an image published to GHCR and rolled out to the VPS over SSH.

on:
  push:
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulate only: no image is published and the VPS is not touched"
        type: boolean
        default: false

# A new push supersedes the run still in flight for the same branch. `main` is
# the exception: cancelling it halfway could abort a deploy mid-rollout.
concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege by default; only build-and-deploy widens it, to push to GHCR.
permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    services:
      # The geometric rules are PostGIS predicates, so CI runs against the same
      # image as development and production -- never a mock.
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: territory
          POSTGRES_PASSWORD: territory
          # The image enables the postgis extension in POSTGRES_DB on init; the
          # test database is created by the step below.
          POSTGRES_DB: territory_map
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U territory -d territory_map"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 20s

    env:
      DATABASE_URL: postgresql+psycopg://territory:territory@localhost:5432/territory_map
      TEST_DATABASE_URL: postgresql+psycopg://territory:territory@localhost:5432/territory_map_test
      # CI-only value. The real secret lives on the VPS, never in this file.
      JWT_SECRET: ci-only-not-a-real-secret
      PGPASSWORD: territory

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Create the test database with PostGIS
        # docker-compose.dev.yml does this with an init script mounted into the
        # container; a service container has no such mount, so it is done here.
        run: |
          psql -h localhost -p 5432 -U territory -d territory_map -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION IF NOT EXISTS postgis'
          psql -h localhost -p 5432 -U territory -d territory_map -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE territory_map_test'
          psql -h localhost -p 5432 -U territory -d territory_map_test -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION IF NOT EXISTS postgis'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.x"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "server/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Tests with coverage
        run: uv run pytest --cov=app --cov-report=term-missing

      - name: Enforce 100% coverage on app/services/
        # CLAUDE.md sets 100% on the services layer -- that is where every
        # business rule lives. The overall report above is informational; this
        # step is the gate that fails the job.
        run: >-
          uv run python -m coverage report
          --include="app/services/*"
          --show-missing
          --fail-under=100

  build-and-deploy:
    name: Build image and deploy
    needs: test
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The SSH credentials live in this Environment. Without this line the job
    # cannot see them and they arrive as empty strings.
    environment: production

    permissions:
      contents: read
      packages: write

    env:
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/territory-map' }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Resolve the image name
        id: image
        # GHCR rejects uppercase in a repository path, and `github.repository`
        # keeps the owner's original casing.
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${repo}-server" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        if: ${{ inputs.dry_run != true }}
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ inputs.dry_run != true }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: ${{ inputs.dry_run != true }}
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          # Layer cache in the Actions cache, so a code-only change does not
          # reinstall the Python dependencies.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Secrets and variables come in through `env:`. Interpolating `${{ }}`
      # inside a `run:` body would turn the value into shell code.
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
        run: |
          set -euo pipefail

          # An empty value almost always means the secret was registered
          # outside the Environment declared by this job.
          for v in SSH_KEY KNOWN_HOSTS SSH_HOST SSH_USER; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is empty. Check that it exists in the 'production' Environment and that the name matches exactly."
              exit 1
            fi
          done

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # printf, never echo: an OpenSSH key without its trailing newline
          # makes ssh fail with `error in libcrypto`.
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 30
            ServerAliveCountMax 20
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

          ssh -q deploy-target 'echo "SSH connection ok"'

      - name: Check prerequisites on the VPS
        run: |
          set -euo pipefail
          ssh deploy-target "set -e
            mkdir -p '$DEPLOY_PATH'
            test -f '$DEPLOY_PATH/.env' || {
              echo '::error::$DEPLOY_PATH/.env does not exist — create it on the VPS before the first deploy'
              exit 1
            }
            docker compose version >/dev/null"

      # Only the compose file and the database init scripts travel over the
      # wire; the application itself arrives as the image built above. `.env`
      # is not inside docker/, so --delete can never reach it.
      - name: Sync the compose stack
        run: |
          set -euo pipefail
          DRY=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY="--dry-run"
            echo "::notice::dry-run — nothing on the VPS will change"
          fi
          rsync -az -i $DRY -e ssh \
            ./docker-compose.yml "deploy-target:$DEPLOY_PATH/docker-compose.yml"
          rsync -az --delete -i $DRY -e ssh \
            ./docker/ "deploy-target:$DEPLOY_PATH/docker/"

      - name: Pull the image and roll out
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          ssh deploy-target "set -e
            cd '$DEPLOY_PATH'
            docker compose pull
            docker compose up -d
            docker image prune -f"

      # Without this the job goes green even when the API fails to boot.
      - name: Health check
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          ssh deploy-target "set -e
            cd '$DEPLOY_PATH'
            port=\$(grep -E '^API_PORT=' .env | cut -d= -f2)
            port=\${port:-8000}
            for i in \$(seq 1 30); do
              code=\$(curl -s -o /dev/null -w '%{http_code}' \"http://127.0.0.1:\$port/health\" || true)
              echo \"attempt \$i: \$code\"
              [ \"\$code\" = '200' ] && exit 0
              sleep 5
            done
            echo '::error::health check failed'
            docker compose ps
            docker compose logs --tail 50
            exit 1"

      - name: Remove credentials from the runner
        if: always()
        run: rm -f ~/.ssh/id_deploy ~/.ssh/config ~/.ssh/known_hosts
