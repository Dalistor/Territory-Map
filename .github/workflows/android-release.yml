name: android-release

# Builds the Android APKs and publishes them to the VPS releases directory,
# where `GET /updates/latest` serves the manifest both apps check on launch.
#
# Only an app whose own files changed is published: publishing an unchanged
# app would still show its users an "update available" prompt. A push that
# only touches this workflow builds both apps as a check and publishes none.
# `workflow_dispatch` chooses explicitly (e.g. to republish after a failure).

on:
  push:
    paths:
      - "app/**"
      - "admin-app/**"
      - ".github/workflows/android-release.yml"
    branches:
      - main
  workflow_dispatch:
    inputs:
      apps:
        description: "Which apps to build and publish"
        type: choice
        options: [both, app, admin-app, build-only]
        default: both
      changelog:
        description: "Text shown in the update dialog (optional)"
        type: string
        default: ""

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build & Deploy Android APKs
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide what to build and publish
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          INPUT_APPS: ${{ inputs.apps }}
        run: |
          set -euo pipefail
          build_app=false; publish_app=false; build_admin=false; publish_admin=false
          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$INPUT_APPS" in
              both) build_app=true; publish_app=true; build_admin=true; publish_admin=true ;;
              app) build_app=true; publish_app=true ;;
              admin-app) build_admin=true; publish_admin=true ;;
              build-only) build_app=true; build_admin=true ;;
            esac
          else
            if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              changed=$(printf 'app/\nadmin-app/\n')
            else
              changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            fi
            if grep -q '^app/' <<<"$changed"; then build_app=true; publish_app=true; fi
            if grep -q '^admin-app/' <<<"$changed"; then build_admin=true; publish_admin=true; fi
            if grep -q '^\.github/workflows/android-release\.yml$' <<<"$changed"; then
              build_app=true; build_admin=true
            fi
          fi
          {
            echo "build_app=$build_app"; echo "publish_app=$publish_app"
            echo "build_admin=$build_admin"; echo "publish_admin=$publish_admin"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Check the app key secret
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
        run: |
          # An APK built without the key starts fine and gets 401 on every request.
          if [ -z "$APP_KEY" ]; then
            echo "::error::Secret APP_KEY is missing from the production environment."
            exit 1
          fi

      - name: Compute app version
        run: |
          # Offset keeps the code above the manually versioned builds already installed (2).
          echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.1.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Publisher App APK
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
        if: steps.plan.outputs.build_app == 'true'
        run: |
          set -euo pipefail
          cd app
          cat > .env <<EOF
          API_BASE_URL=https://territorymap.dalistor.com.br
          APP_KEY=$APP_KEY
          EOF
          npm ci
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Build Admin App APK
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
        if: steps.plan.outputs.build_admin == 'true'
        run: |
          set -euo pipefail
          cd admin-app
          cat > .env <<EOF
          API_BASE_URL=https://territorymap.dalistor.com.br
          APP_KEY=$APP_KEY
          EOF
          npm ci
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare Releases Bundle
        if: steps.plan.outputs.publish_app == 'true' || steps.plan.outputs.publish_admin == 'true'
        env:
          PUBLISH_APP: ${{ steps.plan.outputs.publish_app }}
          PUBLISH_ADMIN: ${{ steps.plan.outputs.publish_admin }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          set -euo pipefail
          notes="${CHANGELOG:-Melhorias e correções.}"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Same APK name and URL the server already serves for each app.
          bundle() {
            local app="$1" source_dir="$2"
            mkdir -p "releases/$app"
            cp "$source_dir"/android/app/build/outputs/apk/release/*.apk "releases/$app/$app-release.apk"
            jq -n --arg app "$app" --argjson code "$VERSION_CODE" --arg name "$VERSION_NAME" \
              --arg notes "$notes" --arg at "$now" \
              '{app: $app, version_code: $code, version_name: $name, min_version_code: 1,
                download_url: "/updates/download/\($app)", apk_filename: "\($app)-release.apk",
                changelog: $notes, published_at: $at}' > "releases/$app/version.json"
            cat "releases/$app/version.json"
          }
          if [ "$PUBLISH_APP" = "true" ]; then bundle app app; fi
          if [ "$PUBLISH_ADMIN" = "true" ]; then bundle admin-app admin-app; fi

      - name: Configure SSH
        if: steps.plan.outputs.publish_app == 'true' || steps.plan.outputs.publish_admin == 'true'
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT || 22 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 30
            ServerAliveCountMax 20
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy Releases to VPS
        if: steps.plan.outputs.publish_app == 'true' || steps.plan.outputs.publish_admin == 'true'
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/territory-map' }}
        run: |
          set -euo pipefail
          for app in app admin-app; do
            [ -d "releases/$app" ] || continue
            ssh deploy-target "mkdir -p '$DEPLOY_PATH/releases/$app'"
            # APK first, manifest last: the phones never see a version whose APK is not there yet.
            scp "releases/$app/$app-release.apk" deploy-target:"$DEPLOY_PATH/releases/$app/"
            scp "releases/$app/version.json" deploy-target:"$DEPLOY_PATH/releases/$app/"
            echo "Published $app $VERSION_NAME ($VERSION_CODE)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          ssh deploy-target "chmod -R 755 '$DEPLOY_PATH/releases'"
